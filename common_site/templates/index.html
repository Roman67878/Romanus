<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Corporate Server</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; margin-top: 50px; background-color: #f4f6f9; color: #333; }
        .card { background: white; width: 400px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; }
        .badge { background: #28a745; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        a { display: block; margin-top: 20px; color: #0056b3; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Internal Server</h1>
        <span class="badge">SECURE CONNECTION</span>
        <p>Система работает в штатном режиме.</p>
        <p>Этот сервер используется для демонстрации защиты от сетевых угроз.</p>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <a href="/api/status">Проверить статус API (JSON)</a>
    </div>
</body>
</html>
